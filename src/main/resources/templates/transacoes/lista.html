<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Transações - FinançasPro</title></head>
<body>
<section th:fragment="content">

    <div class="page-header">
        <div>
            <h1 class="page-title">Transações</h1>
            <p class="page-subtitle">Débito, Pix e demais movimentações bancárias</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalTransacao">
            <i class="bi bi-plus-lg me-1"></i>Nova Transação
        </button>
    </div>

    <!-- Alertas -->
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show mb-3">
        <i class="bi bi-check-circle me-2"></i><span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show mb-3">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th>Descrição</th>
                            <th>Tipo</th>
                            <th>Categoria</th>
                            <th>Conta</th>
                            <th>Data</th>
                            <th>Valor</th>
                            <th style="width:60px"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${transacoes}">
                            <td>
                                <div class="fw-medium" th:text="${t.descricao}">—</div>
                                <div class="text-muted" style="font-size:0.75rem"
                                     th:text="${t.direcao.name() == 'ENTRADA' ? (t.origem ?: '') : (t.destino ?: '')}"></div>
                            </td>
                            <td>
                                <span th:if="${t.tipo != null}" class="badge bg-blue-soft text-accent"
                                      th:text="${t.tipo.name()}">—</span>
                            </td>
                            <td>
                                <span th:if="${t.categoria != null}"
                                      class="badge" style="background:#EDE9FE;color:#7C3AED"
                                      th:text="${t.categoria.nome}">—</span>
                                <span th:unless="${t.categoria != null}" class="text-muted small">—</span>
                            </td>
                            <td class="text-muted small"
                                th:text="${t.conta != null ? t.conta.nome : '—'}">—</td>
                            <td class="text-muted"
                                th:text="${#temporals.format(t.data, 'dd/MM/yyyy')}">—</td>
                            <td>
                                <span th:class="${t.direcao.name() == 'ENTRADA'} ? 'text-income fw-semibold' : 'text-expense fw-semibold'"
                                      th:text="${t.direcao.name() == 'ENTRADA'} ? '+ R$ ' + ${#numbers.formatDecimal(t.valor, 1, 'POINT', 2, 'COMMA')} : '- R$ ' + ${#numbers.formatDecimal(t.valor, 1, 'POINT', 2, 'COMMA')}">
                                    R$ 0,00
                                </span>
                            </td>
                            <td>
                                <a th:href="@{/transacoes/{id}/excluir(id=${t.id})}"
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Excluir esta transação?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(transacoes)}">
                            <td colspan="7">
                                <div class="empty-state">
                                    <i class="bi bi-arrow-left-right"></i>
                                    <p>Nenhuma transação registrada.</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal nova transação -->
    <div class="modal fade" id="modalTransacao" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-arrow-left-right me-2 text-accent"></i>Nova Transação</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/transacoes}" method="post" th:object="${novaTransacao}">
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Descrição</label>
                                <input type="text" class="form-control" th:field="*{descricao}" required
                                       placeholder="Ex: Salário, Supermercado...">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Direção</label>
                                <select class="form-select" th:field="*{direcao}" required onchange="toggleOrigemDestino(this.value)">
                                    <option value="ENTRADA">Entrada (Receita)</option>
                                    <option value="SAIDA">Saída (Despesa)</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Tipo</label>
                                <select class="form-select" th:field="*{tipo}">
                                    <option value="PIX">Pix</option>
                                    <option value="DEBITO">Débito</option>
                                    <option value="TED">TED</option>
                                    <option value="DOC">DOC</option>
                                    <option value="SAQUE">Saque</option>
                                    <option value="DEPOSITO">Depósito</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Valor (R$)</label>
                                <input type="number" step="0.01" min="0.01" class="form-control"
                                       th:field="*{valor}" required placeholder="0,00">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Data</label>
                                <input type="date" class="form-control" th:field="*{data}" required>
                            </div>
                            <div class="col-6" id="campoOrigem">
                                <label class="form-label">Origem (quem enviou)</label>
                                <input type="text" class="form-control" th:field="*{origem}" placeholder="Ex: Empresa XYZ">
                            </div>
                            <div class="col-6" id="campoDestino" style="display:none">
                                <label class="form-label">Destino (para quem)</label>
                                <input type="text" class="form-control" th:field="*{destino}" placeholder="Ex: Supermercado">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Conta</label>
                                <select class="form-select" th:field="*{conta.id}">
                                    <option value="">— Selecione —</option>
                                    <option th:each="c : ${contas}" th:value="${c.id}" th:text="${c.nome}">Conta</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Categoria</label>
                                <select class="form-select" th:field="*{categoria.id}">
                                    <option value="">— Sem categoria —</option>
                                    <option th:each="cat : ${categorias}"
                                            th:value="${cat.id}"
                                            th:text="${cat.isSubcategoria() ? '  └ ' + cat.nome : cat.nome}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Observação</label>
                                <input type="text" class="form-control" th:field="*{observacao}" placeholder="Opcional">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function toggleOrigemDestino(direcao) {
            document.getElementById('campoOrigem').style.display  = direcao === 'ENTRADA' ? '' : 'none';
            document.getElementById('campoDestino').style.display = direcao === 'SAIDA'   ? '' : 'none';
        }
    </script>

</section>
</body>
</html>
