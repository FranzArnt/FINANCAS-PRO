<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Fatura - FinançasPro</title></head>
<body>
<section th:fragment="content">

    <div class="page-header">
        <div>
            <a th:href="@{/cartoes/{id}/faturas(id=${fatura.cartao.id})}"
               class="text-muted text-decoration-none small">
                <i class="bi bi-chevron-left"></i> <span th:text="${fatura.cartao.nome}">Cartão</span>
            </a>
            <h1 class="page-title mt-1">
                Fatura
                <span th:text="${fatura.mesReferencia}">—</span>
            </h1>
            <p class="page-subtitle">
                Fecha <strong th:text="${fatura.dataFechamento != null ? #temporals.format(fatura.dataFechamento, 'dd/MM') : '—'}">—</strong> ·
                Vence <strong th:text="${fatura.dataVencimento != null ? #temporals.format(fatura.dataVencimento, 'dd/MM/yyyy') : '—'}">—</strong>
            </p>
        </div>
        <div class="d-flex gap-2 align-items-start flex-wrap">
            <!-- Novo lançamento (só fatura aberta) -->
            <button th:if="${fatura.status.name() == 'ABERTA'}"
                    class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modalLancamento">
                <i class="bi bi-plus-lg me-1"></i>Lançamento
            </button>
            <!-- Countdown antes do fechamento -->
            <span th:if="${fatura.status.name() == 'ABERTA' and !podeFecharOuPagar}"
                  class="badge bg-warning text-dark align-self-center"
                  style="font-size:0.82rem;padding:0.45em 0.8em">
                <i class="bi bi-clock me-1"></i>Fecha em <span th:text="${diasParaFechar}">0</span> dia<span th:if="${diasParaFechar != 1}">s</span>
            </span>
            <!-- Fechar fatura (opcional, sem pagar) -->
            <form th:if="${fatura.status.name() == 'ABERTA' and podeFecharOuPagar}"
                  th:action="@{/faturas/{id}/fechar(id=${fatura.id})}" method="post">
                <button type="submit" class="btn btn-outline-secondary"
                        onclick="return confirm('Fechar sem pagar? Você poderá pagar depois.')">
                    <i class="bi bi-lock me-1"></i>Fechar
                </button>
            </form>
            <!-- Pagar fatura (aberta, fechada ou vencida) -->
            <form th:if="${(fatura.status.name() == 'ABERTA' and podeFecharOuPagar) or fatura.status.name() == 'FECHADA' or fatura.status.name() == 'VENCIDA'}"
                  th:action="@{/faturas/{id}/pagar(id=${fatura.id})}" method="post">
                <button type="submit" class="btn btn-primary"
                        onclick="return confirm('Pagar fatura? O valor será debitado da conta vinculada.')">
                    <i class="bi bi-check-circle me-1"></i>Pagar Fatura
                </button>
            </form>
        </div>
    </div>

    <!-- Alertas -->
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show mb-3">
        <i class="bi bi-check-circle me-2"></i><span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show mb-3">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Totalizador -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="stat-card">
                <div class="stat-icon bg-expense-soft"><i class="bi bi-receipt text-expense"></i></div>
                <div>
                    <div class="stat-label">Total da Fatura</div>
                    <div class="stat-value text-expense"
                         th:text="'R$ ' + ${#numbers.formatDecimal(fatura.valor, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card">
                <div class="stat-icon"
                     th:classappend="${fatura.status.name() == 'PAGA'} ? 'bg-income-soft' : (${fatura.status.name() == 'VENCIDA'} ? 'bg-expense-soft' : 'bg-warn-soft')">
                    <i class="bi bi-flag"
                       th:classappend="${fatura.status.name() == 'PAGA'} ? ' text-income' : (${fatura.status.name() == 'VENCIDA'} ? ' text-expense' : ' text-warn')"></i>
                </div>
                <div>
                    <div class="stat-label">Status</div>
                    <div class="stat-value" style="font-size:1.1rem">
                        <span th:switch="${fatura.status.name()}">
                            <span th:case="'ABERTA'"  class="badge badge-aberta"  style="font-size:0.9rem">Aberta</span>
                            <span th:case="'FECHADA'" class="badge badge-fechada" style="font-size:0.9rem">Fechada</span>
                            <span th:case="'PAGA'"    class="badge badge-paga"    style="font-size:0.9rem">Paga</span>
                            <span th:case="'VENCIDA'" class="badge badge-vencida" style="font-size:0.9rem">Vencida</span>
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card">
                <div class="stat-icon bg-accent-soft"><i class="bi bi-list-ul text-accent"></i></div>
                <div>
                    <div class="stat-label">Lançamentos</div>
                    <div class="stat-value" th:text="${#lists.size(lancamentos)}">0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Saldo da conta vinculada -->
    <div th:if="${fatura.cartao.conta != null}" class="card mb-4"
         th:style="${saldoSuficiente} ? 'border-left:4px solid var(--green)' : 'border-left:4px solid var(--red)'">
        <div class="card-body d-flex align-items-center justify-content-between py-3">
            <div class="d-flex align-items-center gap-3">
                <div th:classappend="${saldoSuficiente} ? 'bg-income-soft' : 'bg-expense-soft'"
                     style="width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                    <i class="bi bi-wallet2" th:classappend="${saldoSuficiente} ? ' text-income' : ' text-expense'"></i>
                </div>
                <div>
                    <div class="fw-semibold" style="font-size:0.9rem"
                         th:text="'Saldo em ' + ${fatura.cartao.conta.nome}">Conta</div>
                    <div class="fw-bold"
                         th:classappend="${saldoSuficiente} ? 'text-income' : 'text-expense'"
                         th:text="'R$ ' + ${#numbers.formatDecimal(saldoConta, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</div>
                    <div class="text-muted" style="font-size:0.78rem"
                         th:text="${saldoSuficiente} ? 'Saldo suficiente para pagar a fatura' : 'Saldo insuficiente — faltam R$ ' + ${#numbers.formatDecimal(fatura.valor.subtract(saldoConta), 1, 'POINT', 2, 'COMMA')}">
                    </div>
                </div>
            </div>
            <div th:if="${fatura.status.name() == 'PAGA'}" class="text-income fw-semibold" style="font-size:0.85rem">
                <i class="bi bi-check-circle me-1"></i>Fatura paga
            </div>
        </div>
    </div>

    <!-- Tabela de lançamentos -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th>Descrição</th>
                            <th>Categoria</th>
                            <th>Data da Compra</th>
                            <th>Valor</th>
                            <th>Obs.</th>
                            <th th:if="${fatura.status.name() == 'ABERTA'}" style="width:60px"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="l : ${lancamentos}">
                            <td class="fw-medium" th:text="${l.descricao}">—</td>
                            <td>
                                <span th:if="${l.categoria != null}"
                                      class="badge"
                                      style="background:#EDE9FE;color:#7C3AED"
                                      th:text="${l.categoria.nome}">—</span>
                                <span th:unless="${l.categoria != null}" class="text-muted small">—</span>
                            </td>
                            <td class="text-muted"
                                th:text="${#temporals.format(l.dataCompra, 'dd/MM/yyyy')}">—</td>
                            <td class="fw-semibold text-expense"
                                th:text="'R$ ' + ${#numbers.formatDecimal(l.valor, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                            <td class="text-muted small" th:text="${l.observacao ?: '—'}">—</td>
                            <td th:if="${fatura.status.name() == 'ABERTA'}">
                                <a th:href="@{/faturas/{fid}/lancamentos/{lid}/remover(fid=${fatura.id},lid=${l.id})}"
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Remover este lançamento?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(lancamentos)}">
                            <td colspan="6">
                                <div class="empty-state">
                                    <i class="bi bi-inbox"></i>
                                    <p>Nenhum lançamento nesta fatura.</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                    <!-- Rodapé com total -->
                    <tfoot th:if="${not #lists.isEmpty(lancamentos)}">
                        <tr style="background:#F8FAFC">
                            <td colspan="3" class="fw-semibold text-end pe-3">Total</td>
                            <td class="fw-bold text-expense"
                                th:text="'R$ ' + ${#numbers.formatDecimal(fatura.valor, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                            <td colspan="2"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal novo lançamento -->
    <div class="modal fade" id="modalLancamento" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-plus-circle me-2 text-accent"></i>Novo Lançamento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/faturas/{id}/lancamentos(id=${fatura.id})}" method="post" th:object="${novoLancamento}">
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Descrição</label>
                                <input type="text" class="form-control" th:field="*{descricao}" required
                                       placeholder="Ex: Supermercado, Netflix, Farmácia...">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Valor (R$)</label>
                                <input type="number" step="0.01" min="0.01" class="form-control"
                                       th:field="*{valor}" required placeholder="0,00">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Data da Compra</label>
                                <input type="date" class="form-control" th:field="*{dataCompra}" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Categoria</label>
                                <select class="form-select" th:field="*{categoria.id}">
                                    <option value="">— Sem categoria —</option>
                                    <option th:each="cat : ${categorias}"
                                            th:value="${cat.id}"
                                            th:text="${cat.isSubcategoria() ? '  └ ' + cat.nome : cat.nome}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Observação</label>
                                <input type="text" class="form-control" th:field="*{observacao}" placeholder="Opcional">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Adicionar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</section>
</body>
</html>
