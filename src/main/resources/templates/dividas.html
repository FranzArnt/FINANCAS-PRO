<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Dívidas - FinançasPro</title>
</head>
<body>
<section th:fragment="content">

    <div class="page-header">
        <div>
            <h1 class="page-title">Controle de Dívidas</h1>
            <p class="page-subtitle">Gerencie suas dívidas e acompanhe o pagamento</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalDivida" onclick="novaDiv()">
            <i class="bi bi-plus-lg me-1"></i>Nova Dívida
        </button>
    </div>

    <!-- Cards de resumo -->
    <div class="row g-3 mb-4" th:if="${not #lists.isEmpty(dividas)}">
        <div class="col-auto">
            <div class="stat-card">
                <div class="stat-icon bg-expense-soft">
                    <i class="bi bi-exclamation-circle text-expense"></i>
                </div>
                <div>
                    <div class="stat-label">Total em Dívidas</div>
                    <div class="stat-value text-expense"
                         th:text="'R$ ' + ${#numbers.formatDecimal(totalDividas, 1, 'POINT', 2, 'COMMA')}">
                        R$ 0,00
                    </div>
                    <div class="stat-sub">valor restante total</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabela -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Tipo</th>
                            <th>Valor Total</th>
                            <th>Restante</th>
                            <th>Progresso</th>
                            <th>Vencimento</th>
                            <th>Status</th>
                            <th style="width:90px">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="d, dStat : ${dividas}">
                            <td class="fw-medium" th:text="${d.nome}">Nome</td>
                            <td>
                                <span class="badge" style="background:#EDE9FE;color:#7C3AED"
                                      th:text="${d.tipo}">TIPO</span>
                            </td>
                            <td th:text="'R$ ' + ${#numbers.formatDecimal(d.valorTotal, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                            <td class="fw-semibold text-expense"
                                th:text="'R$ ' + ${#numbers.formatDecimal(d.valorRestante != null ? d.valorRestante : 0, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                            <td style="min-width:140px">
                                <div class="progress mb-1">
                                    <div class="progress-bar" style="background:var(--accent)"
                                         th:style="'width:' + ${d.percentualPago} + '%; background:var(--accent)'"></div>
                                </div>
                                <small class="text-muted" th:text="${d.percentualPago} + '% pago'">0%</small>
                            </td>
                            <td th:text="${d.vencimento != null ? #temporals.format(d.vencimento, 'dd/MM/yyyy') : '—'}">—</td>
                            <td>
                                <span class="badge" th:classappend="'badge-status-' + ${d.status}"
                                      th:text="${d.status}">STATUS</span>
                            </td>
                            <td>
                                <button type="button"
                                        class="btn btn-sm btn-outline-primary me-1"
                                        title="Editar"
                                        th:attr="data-index=${dStat.index}"
                                        onclick="editarDivida(this.dataset.index)">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <a th:href="@{/dividas/excluir/{id}(id=${d.id})}"
                                   class="btn btn-sm btn-outline-danger"
                                   title="Excluir"
                                   onclick="return confirm('Excluir esta dívida?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(dividas)}">
                            <td colspan="8">
                                <div class="empty-state">
                                    <i class="bi bi-check-circle"></i>
                                    <p>Nenhuma dívida cadastrada. Ótimo!</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal cadastro/edição -->
    <div class="modal fade" id="modalDivida" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalDividaTitulo">
                        <i class="bi bi-exclamation-circle me-2 text-expense"></i>Nova Dívida
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form action="/dividas/salvar" method="post">
                    <input type="hidden" name="id" id="dividaId">
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-8">
                                <label class="form-label">Nome da Dívida</label>
                                <input type="text" class="form-control" name="nome" id="dividaNome" required
                                       placeholder="Ex: Financiamento, Empréstimo...">
                            </div>
                            <div class="col-4">
                                <label class="form-label">Tipo</label>
                                <select class="form-select" name="tipo" id="dividaTipo">
                                    <option value="FINANCIAMENTO">Financiamento</option>
                                    <option value="EMPRESTIMO">Empréstimo</option>
                                    <option value="CONTA">Conta Atrasada</option>
                                    <option value="PESSOAL">Dívida Pessoal</option>
                                    <option value="OUTRO">Outro</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Valor Total (R$)</label>
                                <input type="number" step="0.01" min="0" class="form-control"
                                       name="valorTotal" id="dividaValorTotal" required placeholder="0,00">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Valor Restante (R$)</label>
                                <input type="number" step="0.01" min="0" class="form-control"
                                       name="valorRestante" id="dividaValorRestante" required placeholder="0,00">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Vencimento <small class="text-muted">(opcional)</small></label>
                                <input type="date" class="form-control" name="vencimento" id="dividaVencimento">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Status</label>
                                <select class="form-select" name="status" id="dividaStatus">
                                    <option value="PENDENTE">Pendente</option>
                                    <option value="ATIVO">Ativo</option>
                                    <option value="VENCIDA">Vencida</option>
                                    <option value="PAGO">Pago</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        var dividasData = /*[[${dividas}]]*/ [];
        /*]]>*/

        function novaDiv() {
            document.getElementById('dividaId').value = '';
            document.getElementById('dividaNome').value = '';
            document.getElementById('dividaValorTotal').value = '';
            document.getElementById('dividaValorRestante').value = '';
            document.getElementById('dividaVencimento').value = '';
            document.getElementById('dividaTipo').value = 'FINANCIAMENTO';
            document.getElementById('dividaStatus').value = 'PENDENTE';
            document.getElementById('modalDividaTitulo').innerHTML =
                '<i class="bi bi-exclamation-circle me-2 text-expense"></i>Nova Dívida';
        }

        function editarDivida(idx) {
            var d = dividasData[idx];
            document.getElementById('dividaId').value = d.id;
            document.getElementById('dividaNome').value = d.nome;
            document.getElementById('dividaValorTotal').value = d.valorTotal;
            document.getElementById('dividaValorRestante').value = d.valorRestante || 0;
            document.getElementById('dividaVencimento').value = d.vencimento || '';
            document.getElementById('dividaTipo').value = d.tipo;
            document.getElementById('dividaStatus').value = d.status;
            document.getElementById('modalDividaTitulo').innerHTML =
                '<i class="bi bi-pencil me-2 text-expense"></i>Editar Dívida';
            new bootstrap.Modal(document.getElementById('modalDivida')).show();
        }
    </script>

</section>
</body>
</html>
