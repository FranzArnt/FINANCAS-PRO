<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title th:text="${cartao.nome} + ' — Faturas - FinançasPro'">Faturas</title></head>
<body>
<section th:fragment="content">

    <div class="page-header">
        <div>
            <a href="/cartoes" class="text-muted text-decoration-none small">
                <i class="bi bi-chevron-left"></i> Cartões
            </a>
            <h1 class="page-title mt-1" th:text="'Faturas — ' + ${cartao.nome}">Faturas</h1>
            <p class="page-subtitle">
                Fecha dia <strong th:text="${cartao.diaFechamento}">0</strong> ·
                Vence dia <strong th:text="${cartao.diaVencimento}">0</strong>
            </p>
        </div>
    </div>

    <!-- Info do cartão -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="stat-card">
                <div class="stat-icon bg-accent-soft"><i class="bi bi-credit-card text-accent"></i></div>
                <div>
                    <div class="stat-label">Limite Total</div>
                    <div class="stat-value" th:text="'R$ ' + ${#numbers.formatDecimal(cartao.limiteTotal, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card">
                <div class="stat-icon bg-income-soft"><i class="bi bi-shield-check text-income"></i></div>
                <div>
                    <div class="stat-label">Limite Disponível</div>
                    <div class="stat-value text-income" th:text="'R$ ' + ${#numbers.formatDecimal(limiteDisponivel, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card">
                <div class="stat-icon bg-warn-soft"><i class="bi bi-calendar-event text-warn"></i></div>
                <div>
                    <div class="stat-label">Próximo Vencimento</div>
                    <div class="stat-value" style="font-size:1.1rem"
                         th:text="${#temporals.format(proximoVencimento, 'dd/MM/yyyy')}">—</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lista de faturas -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th>Mês de Referência</th>
                            <th>Fechamento</th>
                            <th>Vencimento</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th style="width:80px">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="f : ${faturas}">
                            <td class="fw-semibold" th:text="${f.mesReferencia}">—</td>
                            <td class="text-muted" th:text="${f.dataFechamento != null ? #temporals.format(f.dataFechamento, 'dd/MM/yyyy') : '—'}">—</td>
                            <td th:text="${f.dataVencimento != null ? #temporals.format(f.dataVencimento, 'dd/MM/yyyy') : '—'}">—</td>
                            <td class="fw-bold"
                                th:classappend="${f.valor.compareTo(T(java.math.BigDecimal).ZERO) > 0} ? 'text-expense' : ''"
                                th:text="'R$ ' + ${#numbers.formatDecimal(f.valor, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                            <td>
                                <span th:switch="${f.status.name()}">
                                    <span th:case="'ABERTA'"   class="badge badge-aberta">Aberta</span>
                                    <span th:case="'FECHADA'"  class="badge badge-fechada">Fechada</span>
                                    <span th:case="'PAGA'"     class="badge badge-paga">Paga</span>
                                    <span th:case="'VENCIDA'"  class="badge badge-vencida">Vencida</span>
                                </span>
                            </td>
                            <td>
                                <a th:href="@{/faturas/{id}(id=${f.id})}"
                                   class="btn btn-sm btn-outline-primary" title="Ver detalhes">
                                    <i class="bi bi-eye"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(faturas)}">
                            <td colspan="6">
                                <div class="empty-state">
                                    <i class="bi bi-receipt"></i>
                                    <p>Nenhuma fatura gerada ainda.</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</section>
</body>
</html>
