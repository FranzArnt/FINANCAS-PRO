<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Gestor Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-w: 240px;
            --bg: #F1F5F9;
            --sidebar-bg: #0F172A;
            --accent: #6366F1;
            --accent-soft: rgba(99,102,241,0.12);
            --green: #16A34A;
            --green-soft: #DCFCE7;
            --red: #DC2626;
            --red-soft: #FEE2E2;
            --yellow: #D97706;
            --yellow-soft: #FEF3C7;
            --blue-soft: #DBEAFE;
            --text: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --card: #FFFFFF;
            --radius: 12px;
        }

        * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); margin: 0; }

        /* ── Sidebar ─────────────────────────────────── */
        .sidebar {
            width: var(--sidebar-w);
            min-height: 100vh;
            background: var(--sidebar-bg);
            position: fixed;
            left: 0; top: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-logo {
            padding: 20px 18px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo .logo-icon {
            width: 34px; height: 34px;
            background: var(--accent);
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            color: white;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .sidebar-logo .logo-text {
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            line-height: 1.1;
        }

        .sidebar-logo .logo-sub {
            color: rgba(255,255,255,0.38);
            font-size: 0.7rem;
            font-weight: 400;
        }

        .nav-group-label {
            padding: 18px 18px 6px;
            color: rgba(255,255,255,0.28);
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .sidebar .nav-link {
            color: rgba(255,255,255,0.58);
            padding: 9px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.865rem;
            font-weight: 500;
            border-left: 3px solid transparent;
            transition: all 0.15s;
            text-decoration: none;
        }

        .sidebar .nav-link:hover {
            color: #fff;
            background: rgba(255,255,255,0.06);
        }

        .sidebar .nav-link.active {
            color: #fff;
            background: var(--accent-soft);
            border-left-color: var(--accent);
        }

        .sidebar .nav-link i {
            font-size: 1rem;
            width: 18px;
            text-align: center;
            flex-shrink: 0;
        }

        .sidebar .nav-link .badge-soon {
            margin-left: auto;
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.4);
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 20px;
            font-weight: 500;
        }

        .sidebar-bottom {
            margin-top: auto;
            padding: 14px 18px;
            border-top: 1px solid rgba(255,255,255,0.07);
            color: rgba(255,255,255,0.28);
            font-size: 0.72rem;
        }

        /* ── Main Content ────────────────────────────── */
        .main-content {
            margin-left: var(--sidebar-w);
            padding: 28px 30px;
            min-height: 100vh;
        }

        /* ── Cards ───────────────────────────────────── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }

        .card-body { padding: 20px; }

        /* Stat cards */
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .stat-card .stat-icon {
            width: 42px; height: 42px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .stat-card .stat-label {
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .stat-card .stat-value {
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1;
            color: var(--text);
        }

        .stat-card .stat-sub {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 4px;
        }

        /* Color utilities */
        .text-income  { color: var(--green)  !important; }
        .text-expense { color: var(--red)    !important; }
        .text-warn    { color: var(--yellow) !important; }
        .text-accent  { color: var(--accent) !important; }

        .bg-income-soft  { background: var(--green-soft); }
        .bg-expense-soft { background: var(--red-soft); }
        .bg-warn-soft    { background: var(--yellow-soft); }
        .bg-accent-soft  { background: var(--accent-soft); }
        .bg-blue-soft    { background: var(--blue-soft); }

        /* ── Page header ─────────────────────────────── */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text);
            margin: 0 0 3px;
        }

        .page-subtitle {
            color: var(--text-muted);
            font-size: 0.83rem;
            margin: 0;
        }

        /* ── Tables ──────────────────────────────────── */
        .table thead th {
            background: #F8FAFC;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
        }

        .table tbody td {
            padding: 11px 16px;
            vertical-align: middle;
            border-color: var(--border);
            font-size: 0.875rem;
        }

        .table tbody tr:last-child td { border-bottom: none; }
        .table tbody tr:hover { background: #FAFBFC; }

        /* ── Badges ──────────────────────────────────── */
        .badge { font-weight: 500; font-size: 0.72rem; border-radius: 6px; padding: 3px 8px; }

        .badge-ativo, .badge-aberta    { background: var(--green-soft);  color: var(--green); }
        .badge-pendente, .badge-fechada { background: var(--yellow-soft); color: var(--yellow); }
        .badge-vencida                  { background: var(--red-soft);    color: var(--red); }
        .badge-pago, .badge-paga        { background: #F1F5F9;            color: var(--text-muted); }

        /* Legacy badge compat */
        .badge-status-ATIVO    { background: var(--green-soft);  color: var(--green);  border: none; }
        .badge-status-PENDENTE { background: var(--yellow-soft); color: var(--yellow); border: none; }
        .badge-status-VENCIDA  { background: var(--red-soft);    color: var(--red);    border: none; }
        .badge-status-PAGO     { background: #F1F5F9;            color: #94A3B8;       border: none; }

        /* ── Buttons ─────────────────────────────────── */
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            font-weight: 500;
            font-size: 0.875rem;
        }
        .btn-primary:hover { background: #4F46E5; border-color: #4F46E5; }

        .btn-outline-primary  { color: var(--accent); border-color: var(--accent); font-size: 0.875rem; }
        .btn-outline-primary:hover { background: var(--accent); border-color: var(--accent); }

        /* ── Modal ───────────────────────────────────── */
        .modal-header { border-bottom: 1px solid var(--border); padding: 16px 20px; }
        .modal-footer { border-top: 1px solid var(--border); padding: 12px 20px; }
        .modal-title  { font-size: 1rem; font-weight: 700; }

        .form-label   { font-size: 0.82rem; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; }
        .form-control, .form-select { font-size: 0.875rem; border-color: var(--border); border-radius: 8px; }
        .form-control:focus, .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }

        /* ── Progress ────────────────────────────────── */
        .progress { height: 6px; border-radius: 3px; background: var(--border); }
        .progress-bar { border-radius: 3px; }

        /* ── Empty state ─────────────────────────────── */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }
        .empty-state i { font-size: 2.5rem; display: block; margin-bottom: 10px; opacity: 0.4; }
        .empty-state p { margin: 0; font-size: 0.9rem; }

        /* ── Soon badge (nav) ────────────────────────── */
        .coming-soon {
            opacity: 0.45;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon"><i class="bi bi-graph-up-arrow"></i></div>
        <div>
            <div class="logo-text">FinançasPro</div>
            <div class="logo-sub">Gestão Pessoal</div>
        </div>
    </div>

    <div class="nav-group-label">Visão Geral</div>
    <a class="nav-link" th:classappend="${currentPage == 'dashboard'} ? 'active'" href="/dashboard">
        <i class="bi bi-speedometer2"></i> Dashboard
    </a>

    <div class="nav-group-label">Cartão de Crédito</div>
    <a class="nav-link" th:classappend="${currentPage == 'cartoes'} ? 'active'" href="/cartoes">
        <i class="bi bi-credit-card-2-front"></i> Cartões
    </a>

    <div class="nav-group-label">Conta Bancária</div>
    <a class="nav-link" th:classappend="${currentPage == 'transacoes'} ? 'active'" href="/transacoes">
        <i class="bi bi-arrow-left-right"></i> Transações
    </a>

    <div class="nav-group-label">Outros</div>
    <a class="nav-link" th:classappend="${currentPage == 'investimentos'} ? 'active'" href="/investimentos">
        <i class="bi bi-bar-chart-line"></i> Investimentos
    </a>
    <a class="nav-link" th:classappend="${currentPage == 'configuracoes'} ? 'active'" href="/configuracoes">
        <i class="bi bi-gear"></i> Configurações
    </a>

    <div class="sidebar-bottom">
        <i class="bi bi-info-circle me-1"></i>Versão 2.0 — Fase 1
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<div class="main-content">
    <div th:replace="${content}">Conteúdo</div>
</div>
</body>
</html>
