<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Transações - FinançasPro</title>
</head>
<body>
<section th:fragment="content">

    <div class="page-header">
        <div>
            <h1 class="page-title">Transações</h1>
            <p class="page-subtitle">Histórico de movimentações</p>
        </div>
    </div>

    <div class="card">
        <div class="card-body text-center py-5">
            <div style="width:60px;height:60px;background:var(--accent-soft);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
                <i class="bi bi-arrow-left-right" style="font-size:1.5rem;color:var(--accent)"></i>
            </div>
            <h5 class="fw-semibold mb-2">Módulo em migração</h5>
            <p class="text-muted mb-0" style="font-size:0.9rem;max-width:380px;margin:auto">
                As transações agora fazem parte do novo sistema de contas bancárias.
                Em breve disponível com categorias, filtros e saldo em tempo real.
            </p>
        </div>
    </div>

</section>
</body>
</html>
